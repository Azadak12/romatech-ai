services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: romatech
      POSTGRES_PASSWORD: romatech
      POSTGRES_DB: romatech
    ports:
      - '5432:5432'
    volumes:
      - romatech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U romatech']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  romatech_pgdata:

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: romatech
      MYSQL_PASSWORD: romatech
      MYSQL_DATABASE: romatech
    ports:
      - '3306:3306'
    volumes:
      - romatech_mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-prootpass']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  romatech_mysqldata:
